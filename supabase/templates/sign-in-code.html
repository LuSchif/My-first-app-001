<div style="font-family: -apple-system, 'Segoe UI', sans-serif; color: #3e2d25; max-width: 28rem">
  <h2 style="margin: 0 0 12px">Your Broomit code</h2>
  <p style="margin: 0 0 16px">Type this code in Broomit to sign in:</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 0.3em; margin: 0 0 16px">
    {{ .Token }}
  </p>
  <p style="margin: 0; color: #6f5241; font-size: 14px">
    The code works for one hour. If you did not ask for it, you can ignore this email.
  </p>
</div>
